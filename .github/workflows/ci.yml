name: Baa CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  nazm-api-v1:
    name: Nazm API v1 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Nazm
          ref: f58faf061278a610720881bde015f6e70bcbd0c7
          path: Nazm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Add bundled toolchain to PATH (if present)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path ".\gcc\bin") {
            "$env:GITHUB_WORKSPACE\gcc\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Configure embedded path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S Nazm -B Nazm/build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake -B build-embedded -G "MinGW Makefiles" -DBAA_ENABLE_EMBEDDED_NAZM=ON -DBAA_NAZM_SOURCE_DIR="$env:GITHUB_WORKSPACE/Nazm"
          cmake -B build-embedded-default -G "MinGW Makefiles" -DBAA_ENABLE_EMBEDDED_NAZM=ON -DBAA_EMBEDDED_NAZM_DEFAULT=ON -DBAA_NAZM_SOURCE_DIR="$env:GITHUB_WORKSPACE/Nazm"
      - name: Configure embedded path (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S Nazm -B Nazm/build -DCMAKE_BUILD_TYPE=Release
          cmake -B build-embedded -DCMAKE_BUILD_TYPE=Release -DBAA_ENABLE_EMBEDDED_NAZM=ON -DBAA_NAZM_SOURCE_DIR="$GITHUB_WORKSPACE/Nazm"
          cmake -B build-embedded-default -DCMAKE_BUILD_TYPE=Release -DBAA_ENABLE_EMBEDDED_NAZM=ON -DBAA_EMBEDDED_NAZM_DEFAULT=ON -DBAA_NAZM_SOURCE_DIR="$GITHUB_WORKSPACE/Nazm"
      - name: Build embedded path
        run: |
          cmake --build Nazm/build --parallel
          cmake --build build-embedded --parallel
          cmake --build build-embedded-default --parallel
      - name: Verify API, subprocess parity, and cache identity
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          BAA_EMBEDDED_NAZM_TEST: "1"
          BAA_EMBEDDED_NAZM_EXPECT_MODE: opt-in
          BAA: ${{ github.workspace }}/build-embedded/baa${{ runner.os == 'Windows' && '.exe' || '' }}
          NAZM: ${{ github.workspace }}/Nazm/build/nazm${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          $env:BAA_EMBEDDED_NAZM_EXPECT_REVISION = (git -C Nazm rev-parse HEAD).Trim()
          python tests/test_nazm_api_integration.py
      - name: Verify the embedded-default build without a Nazm executable
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          BAA_EMBEDDED_NAZM_TEST: "1"
          BAA_EMBEDDED_NAZM_EXPECT_MODE: default
          BAA: ${{ github.workspace }}/build-embedded-default/baa${{ runner.os == 'Windows' && '.exe' || '' }}
          NAZM: ${{ github.workspace }}/Nazm/build/nazm${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          $env:BAA_EMBEDDED_NAZM_EXPECT_REVISION = (git -C Nazm rev-parse HEAD).Trim()
          python tests/test_nazm_api_integration.py

  frontend-api-v1:
    name: Frontend API v1 (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            configure: -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DBAA_WARNINGS_AS_ERRORS=ON
            skip_memory_bound: "0"
          - name: linux
            os: ubuntu-latest
            configure: -DCMAKE_BUILD_TYPE=Release -DBAA_WARNINGS_AS_ERRORS=ON
            skip_memory_bound: "0"
          - name: linux-asan
            os: ubuntu-latest
            configure: -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_C_FLAGS=-fsanitize=address -fno-omit-frame-pointer" "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address"
            skip_memory_bound: "1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Add bundled toolchain to PATH (if present)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path ".\gcc\bin") {
            "$env:GITHUB_WORKSPACE\gcc\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Build baa_frontend and its probe
        shell: bash
        run: |
          cmake -B build-frontend ${{ matrix.configure }} -DBAA_BUILD_FRONTEND_LIBRARY=ON
          cmake --build build-frontend --parallel
      - name: Verify in-process parity, state reset, and memory
        shell: bash
        env:
          PYTHONUTF8: "1"
          BAA_FRONTEND_PROBE_REQUIRED: "1"
          BAA_FRONTEND_SKIP_MEMORY_BOUND: ${{ matrix.skip_memory_bound }}
          BAA_FRONTEND_PROBE: ${{ github.workspace }}/build-frontend/baa_frontend_probe${{ runner.os == 'Windows' && '.exe' || '' }}
          ASAN_OPTIONS: detect_leaks=0
        run: python tests/test_frontend_api.py

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Add bundled toolchain to PATH (if present)
        shell: pwsh
        run: |
          if (Test-Path ".\gcc\bin") {
            "$env:GITHUB_WORKSPACE\gcc\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Configure (Windows MinGW)
        shell: pwsh
        run: cmake -B build -G "MinGW Makefiles"
      - name: Build
        shell: pwsh
        run: cmake --build build

  windows-installer:
    name: Standalone Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Nazm
          ref: f58faf061278a610720881bde015f6e70bcbd0c7
          path: Nazm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Baa and Nazm
        shell: pwsh
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DBAA_ENABLE_EMBEDDED_NAZM=ON -DBAA_EMBEDDED_NAZM_DEFAULT=ON -DBAA_NAZM_SOURCE_DIR="$env:GITHUB_WORKSPACE/Nazm"
          cmake --build build --target baa baa_runtime
          cmake -S Nazm -B Nazm/build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build Nazm/build
      - name: Prepare pinned private linker
        shell: pwsh
        run: .\scripts\prepare_gcc_bundle.ps1
      - name: Build standalone installer
        shell: pwsh
        run: .\scripts\build_installer.ps1 -SkipBuild -SkipTests
      - name: Verify install, compile, run, and uninstall
        shell: pwsh
        run: |
          .\scripts\test_installer.ps1 -NazmDirectory "$env:GITHUB_WORKSPACE\Nazm\build" `
            -NazmRevision (git -C Nazm rev-parse HEAD).Trim() -EmbeddedNazmMode default
      - name: Upload standalone installer
        uses: actions/upload-artifact@v4
        with:
          name: baa-setup-0.6.0-x64
          path: |
            dist/installer/baa-setup-0.6.0-x64.exe
            dist/installer/baa-setup-0.6.0-x64.exe.sha256
          if-no-files-found: error

  linux-package:
    name: Linux packages on a clean Ubuntu
    # Pinned so the packages' glibc floor matches the container they are tested in.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Nazm
          ref: f58faf061278a610720881bde015f6e70bcbd0c7
          path: Nazm
      - name: Build the Baa packages and Nazm
        run: |
          BAA_NAZM_SOURCE_DIR="$PWD/Nazm" bash scripts/package_linux.sh
          cmake -S Nazm -B Nazm/build -DCMAKE_BUILD_TYPE=Release
          cmake --build Nazm/build -j
      # A fresh container has no Baa, no C toolchain, and no Nazm on PATH, so a
      # pass means the .deb brings what it needs, including the assembler linked
      # into baa, and removes what it installed.
      - name: Verify install, compile, run, and removal on a clean Ubuntu 24.04
        timeout-minutes: 15
        run: |
          docker run --rm -v "$PWD:/work" -w /work ubuntu:24.04 \
            bash scripts/test_linux_package.sh \
              --deb build-linux/baa-0.6.0-Linux-x86_64.deb \
              --tgz build-linux/baa-0.6.0-Linux-x86_64.tar.gz \
              --nazm-dir Nazm/build \
              --nazm-revision "$(git -C Nazm rev-parse HEAD)" \
              --embedded-mode default
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: baa-0.6.0-linux-x86_64
          path: |
            build-linux/baa-0.6.0-Linux-x86_64.deb
            build-linux/baa-0.6.0-Linux-x86_64.deb.sha256
            build-linux/baa-0.6.0-Linux-x86_64.tar.gz
            build-linux/baa-0.6.0-Linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  quick-windows:
    runs-on: windows-latest
    needs: build-windows
    env:
      BAA_NAZM: ${{ github.workspace }}\Nazm\build\nazm.exe
      NAZM: ${{ github.workspace }}\Nazm\build\nazm.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Nazm
          ref: f58faf061278a610720881bde015f6e70bcbd0c7
          path: Nazm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Add bundled toolchain to PATH (if present)
        shell: pwsh
        run: |
          if (Test-Path ".\gcc\bin") {
            "$env:GITHUB_WORKSPACE\gcc\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Configure (Windows MinGW)
        shell: pwsh
        run: |
          cmake -B build -G "MinGW Makefiles"
          cmake -S Nazm -B Nazm/build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: pwsh
        run: |
          cmake --build build
          cmake --build Nazm/build
      - name: QA Quick
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: python scripts/qa_run.py --mode quick --summary-json qa-summary-quick-windows.json
      - name: Upload QA artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-windows-quick-artifacts
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .baa_qa_logs/**
            qa-summary-quick-windows.json
            build/**/*.s
            build/**/*.ir

  full-windows:
    runs-on: windows-latest
    needs: quick-windows
    env:
      BAA_NAZM: ${{ github.workspace }}\Nazm\build\nazm.exe
      NAZM: ${{ github.workspace }}\Nazm\build\nazm.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Nazm
          ref: f58faf061278a610720881bde015f6e70bcbd0c7
          path: Nazm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Add bundled toolchain to PATH (if present)
        shell: pwsh
        run: |
          if (Test-Path ".\gcc\bin") {
            "$env:GITHUB_WORKSPACE\gcc\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Configure (Windows MinGW)
        shell: pwsh
        run: |
          cmake -B build -G "MinGW Makefiles"
          cmake -S Nazm -B Nazm/build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: pwsh
        run: |
          cmake --build build
          cmake --build Nazm/build
      - name: Module Size Guard
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: python scripts/check_module_sizes.py --json-out module-size-full-windows.json
      - name: QA Full
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: python scripts/qa_run.py --mode full --summary-json qa-summary-full-windows.json
      - name: Upload QA artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-windows-full-artifacts
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .baa_qa_logs/**
            module-size-full-windows.json
            qa-summary-full-windows.json
            build/**/*.s
            build/**/*.ir

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure (Linux)
        run: cmake -B build-linux -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-linux -j

  quick-linux:
    runs-on: ubuntu-latest
    needs: build-linux
    env:
      BAA_NAZM: ${{ github.workspace }}/Nazm/build/nazm
      NAZM: ${{ github.workspace }}/Nazm/build/nazm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Nazm
          ref: f58faf061278a610720881bde015f6e70bcbd0c7
          path: Nazm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure (Linux)
        run: |
          cmake -B build-linux -DCMAKE_BUILD_TYPE=Release
          cmake -S Nazm -B Nazm/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          cmake --build build-linux -j
          cmake --build Nazm/build -j
      - name: QA Quick
        env:
          PYTHONUTF8: "1"
        run: python3 scripts/qa_run.py --mode quick --summary-json qa-summary-quick-linux.json
      - name: Upload QA artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-linux-quick-artifacts
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .baa_qa_logs/**
            qa-summary-quick-linux.json
            build-linux/**/*.s
            build-linux/**/*.ir

  full-linux:
    runs-on: ubuntu-latest
    needs: quick-linux
    env:
      BAA_NAZM: ${{ github.workspace }}/Nazm/build/nazm
      NAZM: ${{ github.workspace }}/Nazm/build/nazm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Nazm
          ref: f58faf061278a610720881bde015f6e70bcbd0c7
          path: Nazm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure (Linux)
        run: |
          cmake -B build-linux -DCMAKE_BUILD_TYPE=Release
          cmake -S Nazm -B Nazm/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          cmake --build build-linux -j
          cmake --build Nazm/build -j
      - name: Module Size Guard
        env:
          PYTHONUTF8: "1"
        run: python3 scripts/check_module_sizes.py --json-out module-size-full-linux.json
      - name: QA Full
        env:
          PYTHONUTF8: "1"
        run: python3 scripts/qa_run.py --mode full --summary-json qa-summary-full-linux.json
      - name: Upload QA artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-linux-full-artifacts
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .baa_qa_logs/**
            module-size-full-linux.json
            qa-summary-full-linux.json
            build-linux/**/*.s
            build-linux/**/*.ir

  nazm-shadow-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Nazm
          ref: f58faf061278a610720881bde015f6e70bcbd0c7
          path: Nazm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Add bundled toolchain to PATH (if present)
        shell: pwsh
        run: |
          if (Test-Path ".\gcc\bin") {
            "$env:GITHUB_WORKSPACE\gcc\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Build Baa and Nazm
        shell: pwsh
        run: |
          cmake -B build -G "MinGW Makefiles"
          cmake --build build
          cmake -S Nazm -B Nazm/build -G "MinGW Makefiles"
          cmake --build Nazm/build
      - name: Baa to Nazm shadow parity
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          BAA: ${{ github.workspace }}\build\baa.exe
          BAA_NAZM: ${{ github.workspace }}\Nazm\build\nazm.exe
          NAZM: ${{ github.workspace }}\Nazm\build\nazm.exe
        run: python tests/test_nazm_emitter.py -v

  nazm-shadow-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Nazm
          ref: f58faf061278a610720881bde015f6e70bcbd0c7
          path: Nazm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Baa and Nazm
        run: |
          cmake -B build-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux -j
          cmake -S Nazm -B Nazm/build -DCMAKE_BUILD_TYPE=Release
          cmake --build Nazm/build -j
      - name: Baa to Nazm shadow parity
        env:
          PYTHONUTF8: "1"
          BAA: ${{ github.workspace }}/build-linux/baa
          BAA_NAZM: ${{ github.workspace }}/Nazm/build/nazm
          NAZM: ${{ github.workspace }}/Nazm/build/nazm
        run: python3 tests/test_nazm_emitter.py -v
