name: Baa CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Add bundled toolchain to PATH (if present)
        shell: pwsh
        run: |
          if (Test-Path ".\gcc\bin") {
            "$env:GITHUB_WORKSPACE\gcc\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Configure (Windows MinGW)
        shell: pwsh
        run: cmake -B build -G "MinGW Makefiles"
      - name: Build
        shell: pwsh
        run: cmake --build build

  quick-windows:
    runs-on: windows-latest
    needs: build-windows
    env:
      BAA_NAZM: ${{ github.workspace }}\Nazm\build\nazm.exe
      NAZM: ${{ github.workspace }}\Nazm\build\nazm.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Nazm
          ref: 7be5799f88bf70da781499dd35ccc4c4eda12e6f
          path: Nazm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Add bundled toolchain to PATH (if present)
        shell: pwsh
        run: |
          if (Test-Path ".\gcc\bin") {
            "$env:GITHUB_WORKSPACE\gcc\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Configure (Windows MinGW)
        shell: pwsh
        run: |
          cmake -B build -G "MinGW Makefiles"
          cmake -S Nazm -B Nazm/build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: pwsh
        run: |
          cmake --build build
          cmake --build Nazm/build
      - name: QA Quick
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: python scripts/qa_run.py --mode quick --summary-json qa-summary-quick-windows.json
      - name: Upload QA artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-windows-quick-artifacts
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .baa_qa_logs/**
            qa-summary-quick-windows.json
            build/**/*.s
            build/**/*.ir

  full-windows:
    runs-on: windows-latest
    needs: quick-windows
    env:
      BAA_NAZM: ${{ github.workspace }}\Nazm\build\nazm.exe
      NAZM: ${{ github.workspace }}\Nazm\build\nazm.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Nazm
          ref: 7be5799f88bf70da781499dd35ccc4c4eda12e6f
          path: Nazm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Add bundled toolchain to PATH (if present)
        shell: pwsh
        run: |
          if (Test-Path ".\gcc\bin") {
            "$env:GITHUB_WORKSPACE\gcc\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Configure (Windows MinGW)
        shell: pwsh
        run: |
          cmake -B build -G "MinGW Makefiles"
          cmake -S Nazm -B Nazm/build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: pwsh
        run: |
          cmake --build build
          cmake --build Nazm/build
      - name: Module Size Guard
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: python scripts/check_module_sizes.py --json-out module-size-full-windows.json
      - name: QA Full
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: python scripts/qa_run.py --mode full --summary-json qa-summary-full-windows.json
      - name: Upload QA artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-windows-full-artifacts
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .baa_qa_logs/**
            module-size-full-windows.json
            qa-summary-full-windows.json
            build/**/*.s
            build/**/*.ir

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure (Linux)
        run: cmake -B build-linux -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-linux -j

  quick-linux:
    runs-on: ubuntu-latest
    needs: build-linux
    env:
      BAA_NAZM: ${{ github.workspace }}/Nazm/build/nazm
      NAZM: ${{ github.workspace }}/Nazm/build/nazm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Nazm
          ref: 7be5799f88bf70da781499dd35ccc4c4eda12e6f
          path: Nazm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure (Linux)
        run: |
          cmake -B build-linux -DCMAKE_BUILD_TYPE=Release
          cmake -S Nazm -B Nazm/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          cmake --build build-linux -j
          cmake --build Nazm/build -j
      - name: QA Quick
        env:
          PYTHONUTF8: "1"
        run: python3 scripts/qa_run.py --mode quick --summary-json qa-summary-quick-linux.json
      - name: Upload QA artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-linux-quick-artifacts
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .baa_qa_logs/**
            qa-summary-quick-linux.json
            build-linux/**/*.s
            build-linux/**/*.ir

  full-linux:
    runs-on: ubuntu-latest
    needs: quick-linux
    env:
      BAA_NAZM: ${{ github.workspace }}/Nazm/build/nazm
      NAZM: ${{ github.workspace }}/Nazm/build/nazm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Nazm
          ref: 7be5799f88bf70da781499dd35ccc4c4eda12e6f
          path: Nazm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure (Linux)
        run: |
          cmake -B build-linux -DCMAKE_BUILD_TYPE=Release
          cmake -S Nazm -B Nazm/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          cmake --build build-linux -j
          cmake --build Nazm/build -j
      - name: Module Size Guard
        env:
          PYTHONUTF8: "1"
        run: python3 scripts/check_module_sizes.py --json-out module-size-full-linux.json
      - name: QA Full
        env:
          PYTHONUTF8: "1"
        run: python3 scripts/qa_run.py --mode full --summary-json qa-summary-full-linux.json
      - name: Upload QA artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-linux-full-artifacts
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .baa_qa_logs/**
            module-size-full-linux.json
            qa-summary-full-linux.json
            build-linux/**/*.s
            build-linux/**/*.ir

  nazm-shadow-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Nazm
          ref: 7be5799f88bf70da781499dd35ccc4c4eda12e6f
          path: Nazm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Add bundled toolchain to PATH (if present)
        shell: pwsh
        run: |
          if (Test-Path ".\gcc\bin") {
            "$env:GITHUB_WORKSPACE\gcc\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Build Baa and Nazm
        shell: pwsh
        run: |
          cmake -B build -G "MinGW Makefiles"
          cmake --build build
          cmake -S Nazm -B Nazm/build -G "MinGW Makefiles"
          cmake --build Nazm/build
      - name: Baa to Nazm shadow parity
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          BAA: ${{ github.workspace }}\build\baa.exe
          BAA_NAZM: ${{ github.workspace }}\Nazm\build\nazm.exe
          NAZM: ${{ github.workspace }}\Nazm\build\nazm.exe
        run: python tests/test_nazm_emitter.py -v

  nazm-shadow-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Nazm
          ref: 7be5799f88bf70da781499dd35ccc4c4eda12e6f
          path: Nazm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Baa and Nazm
        run: |
          cmake -B build-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux -j
          cmake -S Nazm -B Nazm/build -DCMAKE_BUILD_TYPE=Release
          cmake --build Nazm/build -j
      - name: Baa to Nazm shadow parity
        env:
          PYTHONUTF8: "1"
          BAA: ${{ github.workspace }}/build-linux/baa
          BAA_NAZM: ${{ github.workspace }}/Nazm/build/nazm
          NAZM: ${{ github.workspace }}/Nazm/build/nazm
        run: python3 tests/test_nazm_emitter.py -v
